# Useful hints
# https://mikebian.co/mastering-tmux/
set -g default-terminal "screen-256color"

# Pass through kitty graphics protocol (for image.nvim etc.)
set -g allow-passthrough on

# Forward OSC 8 hyperlinks (titled links, e.g. Claude Code markdown) to the
# outer terminal. Without this tmux strips the target and only plain URLs, which
# kitty re-detects from screen text, stay clickable.
set -ga terminal-features "*:hyperlinks"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g visual-activity off
set-option -g focus-events on

setw -g mode-keys vi
set-option -g history-limit 10000
set -g @plugin 'niksingh710/minimal-tmux-status'

set-option -g @sidebar_auto_create "off"
set -g @plugin 'hiroppy/tmux-agent-sidebar'

# Run hook when creating session to color code status bar
# https://unix.stackexchange.com/a/779936
set-hook -g session-created "send-keys ~/tmux-session-style.sh Enter"
set -g @minimal-tmux-right true
set -g @minimal-tmux-status-left-extra ""
# set -g @minimal-tmux-status-left-extra " #S "
## Needed for linux to not delay on escaping
# https://www.reddit.com/r/vim/comments/40257u/delay_on_esc_with_tmux_and_vim/
set -sg escape-time 0
set -g history-limit 200000

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @minimal-tmux-status-right-extra '#{cpu_fg_color} #{cpu_bg_color} CPU: #{cpu_icon} #{cpu_percentage} | RAM: #{ram_percentage}'
set -g @cpu_low_fg_color "#[fg=#00ff00]"
set -g @cpu_medium_fg_color "#[fg=purple]"
set -g @cpu_high_fg_color "#[fg=cyan]"

set -g @cpu_low_bg_color "#[bg='']"
set -g @cpu_medium_bg_color "#[bg=yellow]"
set -g @cpu_high_bg_color "#[bg=red]"
# turn on mouse mode
set -g mouse on
# after selecting don't jump to bottom
unbind -T copy-mode-vi MouseDragEnd1Pane

# Better copy mode binds
bind -n M-Enter copy-mode \; send-keys ?
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Word "autocomplete" from the visible pane (Vim insert-mode C-n equivalent).
# prefix + Tab -> fzf popup of every token on screen/scrollback; Enter inserts
# the pick at the cursor. Tab inside the popup cycles word/line/path grammars.
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'Tab'
set -g @extrakto_split_direction 'p'   # popup (tmux >= 3.2)
set -g @extrakto_grab_area 'window recent'

# tmux-fingers: hint labels over on-screen matches. prefix + F, then:
#   plain hint     -> copy match        (@fingers-main-action, default :copy:)
#   SHIFT + hint   -> open in nvim      (path|line jumps straight to the line)
# TPM-managed: on first `prefix + F` it offers to download the binary.
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key Space   # trigger: prefix + Space (overrides default next-layout)
# Match our `path|line` citation form (alongside the built-in path/url/etc).
set -g @fingers-pattern-0 '[\w./-]+\|\d+'
# SHIFT action opens the match in nvim. fingers execs the action directly (no
# shell, no ~ expansion) from the pane's cwd, so route through `sh -c` to expand
# $HOME: portable across machines, no hardcoded path, works from any directory.
set -g @fingers-shift-action 'sh -c "$HOME/.dotfiles/bin/tmux-fingers-open"'

# Alt vim arrows to switch windows / sessions
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-k switch-client -p
bind -n M-j switch-client -n

# Search scrollback buffer in neovim (falls back to less)
bind-key g capture-pane -S -32767 -J \; new-window ' \
  tmux save-buffer - \; delete-buffer | {                 \
    nvim -R -c "set nofoldenable incsearch hlsearch ignorecase" -; \
    test $? -eq 127 && less;                              \
  };                                                      \
' \; send-keys G ? # go to bottom and search upward

# Clear buffer history
bind k send-keys -R \; clear-history

# Left-padding pane for wide displays. Bottom for centering
bind P split-window -hb -p 25 -d
bind B split-window -v -l 25% -d

if-shell "uname | grep -q Linux" "run ~/.tmux/plugins/tpm/tpm;" "run $HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm"

